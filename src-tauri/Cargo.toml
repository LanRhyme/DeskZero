[package]
name = "deskzero"
version = "1.1.0"
edition = "2021"
default-run = "deskzero"

[lib]
name = "deskzero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
thiserror = "2"
lnk = "0.6"
opener = "0.7"
win-icon-extractor = "0.2.0"
base64 = "0.22.1"
notify = "6"
tauri-plugin-drag = "2.1.1"
win-context-menu = "0.1.4"
clipboard-win = "5.4.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
rayon = "1.12.0"
trash = "5.2.6"
once_cell = "1"
winreg = "0.56.0"
xcap = "0.9.6"
image = "0.25.10"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_System_Ole", "Media", "Media_Control", "Foundation", "Storage_Streams", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_Environment", "Win32_System_Services"] }
windows-service = "0.7.0"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2.0.0"
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
pollster = "0.4"

[dev-dependencies]
serial_test = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
