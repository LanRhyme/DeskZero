name: Release DeskZero Windows

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from deskzero.config.json
        id: get_version
        run: |
          $config = Get-Content deskzero.config.json | ConvertFrom-Json
          $version = $config.version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Version is $version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm install

      - name: Sync version configuration
        run: node scripts/sync-config.js

      - name: Build Tauri app
        run: npm run tauri build -- --bundles msi

      - name: Create Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "src-tauri/target/release/portable.mode" -Force
          Compress-Archive -Path "src-tauri/target/release/deskzero.exe","src-tauri/target/release/portable.mode" -DestinationPath DeskZero-Portable-v${{ env.VERSION }}.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DeskZero v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DeskZero-Portable-v${{ env.VERSION }}.zip
            src-tauri/target/release/bundle/msi/*.msi
