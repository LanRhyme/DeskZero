[package]
name = "deskzero"
version = "0.1.0"
edition = "2021"

[lib]
name = "deskzero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
thiserror = "2"
lnk = "0.6"
opener = "0.7"
win-icon-extractor = "0.2.0"
base64 = "0.22.1"
notify = "6"
tauri-plugin-drag = "2.1.1"
win-context-menu = "0.1.4"
clipboard-win = "5.4.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
rayon = "1.12.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
