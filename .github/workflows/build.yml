name: Build DeskZero Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm install

      - name: Sync version configuration
        run: node scripts/sync-config.js

      - name: Build Tauri app
        run: npm run tauri build -- --bundles msi

      - name: Create Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "src-tauri/target/release/portable.mode" -Force
          Compress-Archive -Path "src-tauri/target/release/deskzero.exe","src-tauri/target/release/portable.mode" -DestinationPath DeskZero-Portable.zip

      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: DeskZero-Portable
          path: DeskZero-Portable.zip

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: DeskZero-MSI-Installer
          path: src-tauri/target/release/bundle/msi/*.msi
